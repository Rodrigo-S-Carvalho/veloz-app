name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  IMAGE_NAME: rcarv

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./app/api-gateway
          push: true
          tags: ${{ env.IMAGE_NAME }}/app-api-gateway:latest

      - name: Build and push Pedidos
        uses: docker/build-push-action@v5
        with:
          context: ./app/pedidos
          push: true
          tags: ${{ env.IMAGE_NAME }}/app-pedidos:latest

      - name: Build and push Pagamentos
        uses: docker/build-push-action@v5
        with:
          context: ./app/pagamentos
          push: true
          tags: ${{ env.IMAGE_NAME }}/app-pagamentos:latest

      - name: Build and push Estoque
        uses: docker/build-push-action@v5
        with:
          context: ./app/estoque
          push: true
          tags: ${{ env.IMAGE_NAME }}/app-estoque:latest

      - name: Build and push Web
        uses: docker/build-push-action@v5
        with:
          context: ./app/web
          push: true
          tags: ${{ env.IMAGE_NAME }}/app-web:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/

      - name: Restart deployments
        run: |
          kubectl rollout restart deployment -n loja-veloz